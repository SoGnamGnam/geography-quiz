name: Refresh data

# Regenerates the datasets from Wikidata once a month (and on demand) and opens
# a pull request with the changes, so every data update is reviewed before it
# reaches the app.

on:
  schedule:
    - cron: '0 4 1 * *' # 04:00 UTC on the 1st of every month
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data:countries -- --refresh
        env:
          WIKIDATA_USER_AGENT: >-
            world-quiz-data-bot/1.0
            (https://github.com/${{ github.repository }}; GitHub Actions)
      - run: npm test
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: data/refresh
          delete-branch: true
          commit-message: 'data: refresh from Wikidata'
          title: 'data: monthly refresh from Wikidata'
          body: |
            Automatic monthly regeneration of the datasets from Wikidata,
            Natural Earth and Wikimedia Commons.

            Review the diff of `data/countries.json` (one country per line) before merging.
            Wrong values can be fixed in `overrides/countries.json`.
          labels: data
